<script>/* Design vor dem ersten Bild setzen, sonst blitzt kurz das andere auf */ try { const h = document.documentElement, l = k => JSON.parse(localStorage.getItem(k)); h.classList.toggle('hell', l('jdv-design') === 'hell'); h.classList.toggle('ohnegold', l('jdv-gold') === false); document.querySelector('meta[name=theme-color]').content = getComputedStyle(h).getPropertyValue('--bg').trim(); } catch (e) { }</script>
